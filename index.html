<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>汉字书写和笔顺</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js"></script>
    <script src="./vendor/cnchar.min.js"></script>
    <script src="./vendor/cnchar.radical.min.js"></script>
    <script src="./vendor/cnchar.words.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --ink: #111827;
        --muted: #6b7280;
        --line: #d7dde8;
        --line-strong: #a9b4c6;
        --paper: #fbfcff;
        --surface: #ffffff;
        --accent: #d13f2f;
        --accent-soft: #fff0ed;
        --character-ink: #2f343b;
        --character-soft: #eef0f3;
        --shadow: 0 18px 50px rgba(31, 41, 55, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 0%, rgba(209, 63, 47, 0.1), transparent 28rem),
          linear-gradient(160deg, #fff7f3 0%, #f8fbff 44%, #eef7f4 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      .app {
        width: min(100%, 52rem);
        min-height: 100dvh;
        margin: 0 auto;
        padding: env(safe-area-inset-top) 1rem env(safe-area-inset-bottom);
        display: flex;
        flex-direction: column;
      }

      header {
        text-align: center;
        padding: 0.75rem 0;
        flex-shrink: 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.45rem, 5vw, 2.4rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .hint {
        margin: 0.35rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      button {
        min-width: 2.75rem;
        height: 2.75rem;
        border: 1px solid rgba(17, 24, 39, 0.1);
        border-radius: 0.75rem;
        background: rgba(255, 255, 255, 0.86);
        color: var(--ink);
        font: inherit;
        font-weight: 700;
        box-shadow: 0 8px 24px rgba(31, 41, 55, 0.08);
      }

      button:active {
        transform: translateY(1px);
      }

      .display-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        min-height: 0;
      }

      .character-frame {
        position: relative;
        width: min(85vw, 22rem);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border: 2px solid var(--line-strong);
        border-radius: 1rem;
        overflow: hidden;
        background:
          linear-gradient(90deg, transparent calc(50% - 1px), var(--line-strong) 50%, transparent calc(50% + 1px)),
          linear-gradient(0deg, transparent calc(50% - 1px), var(--line-strong) 50%, transparent calc(50% + 1px)),
          linear-gradient(45deg, transparent calc(50% - 1px), var(--line) 50%, transparent calc(50% + 1px)),
          linear-gradient(-45deg, transparent calc(50% - 1px), var(--line) 50%, transparent calc(50% + 1px)),
          var(--paper);
        box-shadow: var(--shadow);
      }

      .writer {
        position: absolute;
        inset: 0;
        z-index: 1;
      }

      .character {
        display: inline-block;
        position: relative;
        z-index: 2;
        text-align: center;
        color: var(--character-ink);
        font-family: "Noto Serif SC", "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
        font-size: 18rem;
        font-weight: 600;
        line-height: 0.92;
        transform: translateY(-0.02em);
        user-select: none;
      }

      .empty {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        padding: 2rem;
        color: var(--muted);
        font-size: clamp(1.05rem, 4vw, 1.3rem);
        line-height: 1.6;
        text-align: center;
      }

      .character-info {
        width: min(85vw, 22rem);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.45rem;
      }

      .info-item {
        min-width: 0;
        padding: 0.45rem 0.6rem;
        border: 1px solid rgba(17, 24, 39, 0.08);
        border-radius: 0.7rem;
        background: rgba(255, 255, 255, 0.72);
        font-size: 0.85rem;
        line-height: 1.35;
      }

      .info-item--words {
        grid-column: 1 / -1;
      }

      .info-label {
        display: block;
        margin-bottom: 0.08rem;
        color: var(--muted);
        font-size: 0.72rem;
      }

      .info-value {
        display: block;
        overflow: hidden;
        color: var(--character-ink);
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .control-panel {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .stroke-panel {
        display: grid;
        gap: 0.55rem;
        padding: 0.1rem 0 0.25rem;
      }

      .replay-row {
        display: flex;
        justify-content: center;
        padding: 0.25rem 0;
      }

      .stroke-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .replay-button {
        width: auto;
        min-width: 4.2rem;
        height: 2.25rem;
        padding: 0 0.85rem;
        border-color: rgba(47, 52, 59, 0.14);
        background: rgba(255, 255, 255, 0.78);
        color: var(--character-ink);
        box-shadow: none;
      }

      .stroke-order {
        display: flex;
        gap: 0.5rem;
        overflow-x: auto;
        padding-bottom: 0.1rem;
        scrollbar-width: none;
      }

      .stroke-order::-webkit-scrollbar {
        display: none;
      }

      .stroke-card {
        position: relative;
        flex: 0 0 auto;
        width: 4.2rem;
        aspect-ratio: 1;
        border: 1px solid rgba(47, 52, 59, 0.12);
        border-radius: 0.7rem;
        background: rgba(255, 255, 255, 0.78);
        overflow: hidden;
      }

      .stroke-card svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .stroke-card span {
        position: absolute;
        top: 0.25rem;
        left: 0.35rem;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 700;
      }

      .input-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.6rem;
        padding: 0.65rem;
        border: 1px solid rgba(17, 24, 39, 0.08);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 12px 30px rgba(31, 41, 55, 0.09);
      }

      input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 1.45rem;
        line-height: 1.2;
        padding: 0.45rem 0.5rem;
      }

      input::placeholder {
        color: #9ca3af;
      }

      .primary-button {
        width: auto;
        min-width: 4.75rem;
        padding: 0 1rem;
        border-color: transparent;
        background: var(--accent);
        color: #fff;
      }

      .recent {
        display: flex;
        gap: 0.5rem;
        overflow-x: auto;
        padding: 0.1rem 0 0.25rem;
        scrollbar-width: none;
      }

      .recent::-webkit-scrollbar {
        display: none;
      }

      .recent button {
        flex: 0 0 auto;
        min-width: 3rem;
        background: var(--character-soft);
        border-color: rgba(47, 52, 59, 0.14);
        color: var(--character-ink);
        font-family: "Noto Serif SC", "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
        font-size: 1.45rem;
      }


      @media (max-width: 420px) {
        .app {
          padding-left: 0.85rem;
          padding-right: 0.85rem;
        }

        .character-frame {
          width: min(88vw, 24rem);
          border-radius: 0.85rem;
        }

        .character-info {
          width: min(88vw, 24rem);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <div>
          <h1>汉字书写和笔顺</h1>
        </div>
      </header>

      <section class="display-panel" aria-live="polite">
        <div class="character-frame" aria-label="田字格">
          <div id="writer" class="writer" aria-hidden="true"></div>
          <div id="empty" class="empty">在下面输入汉字<br />这里会显示大字</div>
          <div id="character" class="character" hidden></div>
        </div>
        <section id="character-info" class="character-info" aria-label="汉字资料" hidden>
          <div class="info-item"><span class="info-label">拼音</span><span id="info-pinyin" class="info-value">—</span></div>
          <div class="info-item"><span class="info-label">偏旁</span><span id="info-component" class="info-value">—</span></div>
          <div class="info-item"><span class="info-label">部首</span><span id="info-radical" class="info-value">—</span></div>
          <div class="info-item"><span class="info-label">结构</span><span id="info-structure" class="info-value">—</span></div>
          <div class="info-item info-item--words"><span class="info-label">组词</span><span id="info-words" class="info-value">—</span></div>
        </section>
      </section>

      <section class="control-panel">
        <div class="stroke-panel" aria-label="笔顺">
          <div class="replay-row">
            <button id="replay" class="replay-button" type="button">重播</button>
          </div>
          <div class="stroke-header">
            <span id="stroke-summary">笔顺会显示在这里</span>
          </div>
          <div id="stroke-order" class="stroke-order"></div>
        </div>
        <form id="form" class="input-row" autocomplete="off">
          <input
            id="input"
            type="search"
            name="hanzi-search"
            inputmode="text"
            autocomplete="new-password"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            data-lpignore="true"
            data-1p-ignore="true"
            data-form-type="other"
            placeholder="例如：爱"
            aria-label="输入汉字"
          />
        </form>
        <div id="recent" class="recent" aria-label="最近查看"></div>
      </section>
    </main>

    <script>
      const input = document.querySelector("#input");
      const form = document.querySelector("#form");
      const writerTarget = document.querySelector("#writer");
      const character = document.querySelector("#character");
      const empty = document.querySelector("#empty");
      const recent = document.querySelector("#recent");
      const replay = document.querySelector("#replay");
      const strokeOrder = document.querySelector("#stroke-order");
      const strokeSummary = document.querySelector("#stroke-summary");
      const characterInfo = document.querySelector("#character-info");
      const infoPinyin = document.querySelector("#info-pinyin");
      const infoComponent = document.querySelector("#info-component");
      const infoRadical = document.querySelector("#info-radical");
      const infoStructure = document.querySelector("#info-structure");
      const infoWords = document.querySelector("#info-words");

      const storageKey = "hanzi-recent";
      let recentChars = loadRecent();
      let fitTimer;
      let writer;
      let currentChar = "";
      let animationLoopToken = 0;
      const measuringCanvas = document.createElement("canvas");
      const measuringContext = measuringCanvas.getContext("2d");

      // 优先展示人工筛选的常用组词；其他字由随应用提供的离线字典查询。
      const curatedCharacterDetails = {
        "爱": { pinyin: "ài", component: "爫", radical: "爫", structure: "上下结构", words: ["爱心", "热爱"] },
        "吧": { words: ["好吧", "酒吧"] },
        "安": { pinyin: "ān", component: "女", radical: "宀", structure: "上下结构", words: ["安全", "安静"] },
        "八": { pinyin: "bā", component: "丿", radical: "八", structure: "独体字", words: ["八方", "八成"] },
        "白": { pinyin: "bái", component: "日", radical: "白", structure: "独体字", words: ["白色", "明白"] },
        "不": { pinyin: "bù", component: "一", radical: "一", structure: "独体字", words: ["不是", "不但"] },
        "大": { pinyin: "dà", component: "人", radical: "大", structure: "独体字", words: ["大小", "大家"] },
        "的": { pinyin: "de", component: "勺", radical: "白", structure: "左右结构", words: ["目的", "好的"] },
        "地": { pinyin: "dì", component: "也", radical: "土", structure: "左右结构", words: ["地方", "土地"] },
        "个": { pinyin: "gè", component: "丨", radical: "人", structure: "独体字", words: ["个人", "一个"] },
        "好": { pinyin: "hǎo", component: "子", radical: "女", structure: "左右结构", words: ["好看", "美好"] },
        "汉": { pinyin: "hàn", component: "又", radical: "氵", structure: "左右结构", words: ["汉字", "汉语"] },
        "和": { pinyin: "hé", component: "口", radical: "口", structure: "左右结构", words: ["和平", "和气"] },
        "家": { pinyin: "jiā", component: "豕", radical: "宀", structure: "上下结构", words: ["家庭", "大家"] },
        "间": { pinyin: "jiān", component: "日", radical: "门", structure: "半包围结构", words: ["中间", "时间"] },
        "见": { pinyin: "jiàn", component: "儿", radical: "见", structure: "上下结构", words: ["看见", "见面"] },
        "今": { pinyin: "jīn", component: "丶", radical: "人", structure: "上下结构", words: ["今天", "今年"] },
        "里": { pinyin: "lǐ", component: "土", radical: "里", structure: "上下结构", words: ["里面", "这里"] },
        "妈": { pinyin: "mā", component: "马", radical: "女", structure: "左右结构", words: ["妈妈", "姑妈"] },
        "你": { pinyin: "nǐ", component: "尔", radical: "亻", structure: "左右结构", words: ["你好", "你们"] },
        "人": { pinyin: "rén", component: "丿", radical: "人", structure: "独体字", words: ["人民", "别人"] },
        "日": { pinyin: "rì", component: "一", radical: "日", structure: "独体字", words: ["日子", "生日"] },
        "山": { pinyin: "shān", component: "丨", radical: "山", structure: "独体字", words: ["高山", "山水"] },
        "上": { pinyin: "shàng", component: "丨", radical: "一", structure: "独体字", words: ["上面", "上午"] },
        "是": { pinyin: "shì", component: "人", radical: "日", structure: "上下结构", words: ["可是", "于是"] },
        "水": { pinyin: "shuǐ", component: "亅", radical: "水", structure: "独体字", words: ["水果", "喝水"] },
        "天": { pinyin: "tiān", component: "大", radical: "大", structure: "上下结构", words: ["天气", "天空"] },
        "我": { pinyin: "wǒ", component: "戈", radical: "戈", structure: "左右结构", words: ["我们", "自我"] },
        "文": { pinyin: "wén", component: "乂", radical: "文", structure: "独体字", words: ["文字", "文化"] },
        "小": { pinyin: "xiǎo", component: "亅", radical: "小", structure: "独体字", words: ["小心", "大小"] },
        "学": { pinyin: "xué", component: "子", radical: "子", structure: "上下结构", words: ["学习", "学生"] },
        "一": { pinyin: "yī", component: "一", radical: "一", structure: "独体字", words: ["一天", "一起"] },
        "有": { pinyin: "yǒu", component: "月", radical: "月", structure: "上下结构", words: ["没有", "所有"] },
        "中": { pinyin: "zhōng", component: "丨", radical: "丨", structure: "独体字", words: ["中国", "中间"] },
        "字": { pinyin: "zì", component: "子", radical: "宀", structure: "上下结构", words: ["汉字", "写字"] }
      };

      function loadRecent() {
        try {
          return JSON.parse(localStorage.getItem(storageKey)) || [];
        } catch {
          return [];
        }
      }

      function saveRecent() {
        localStorage.setItem(storageKey, JSON.stringify(recentChars.slice(0, 12)));
      }

      function firstHanzi(text) {
        return Array.from(text.trim()).find((char) => /\p{Script=Han}/u.test(char)) || "";
      }

      function hanziAtInputSelection() {
        const text = input.value;
        const cursor = input.selectionStart || 0;
        const chars = Array.from(text);
        let offset = 0;
        let previousHanzi = "";

        for (const char of chars) {
          const start = offset;
          const end = start + char.length;
          const isHanzi = /\p{Script=Han}/u.test(char);

          if (isHanzi && cursor >= start && cursor < end) return char;
          if (isHanzi && end <= cursor) previousHanzi = char;
          offset = end;
        }

        return previousHanzi || firstHanzi(text);
      }

      function renderRecent() {
        recent.innerHTML = "";
        recentChars.forEach((char) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = char;
          button.title = `显示 ${char}`;
          button.addEventListener("click", () => showCharacter(char, { syncInput: true }));
          recent.append(button);
        });
      }

      function renderCharacterInfo(char) {
        const curatedDetail = curatedCharacterDetails[char] || {};
        const dictionaryDetail = lookupDictionaryDetail(char);
        const detail = {
          pinyin: curatedDetail.pinyin || dictionaryDetail.pinyin,
          component: curatedDetail.component || dictionaryDetail.component,
          radical: curatedDetail.radical || dictionaryDetail.radical,
          structure: curatedDetail.structure || dictionaryDetail.structure,
          words: curatedDetail.words || dictionaryDetail.words
        };
        characterInfo.hidden = false;

        infoPinyin.textContent = detail.pinyin || "—";
        infoComponent.textContent = detail.component || "—";
        infoRadical.textContent = detail.radical || "—";
        infoStructure.textContent = detail.structure || "—";
        infoWords.textContent = detail.words.length ? detail.words.join("、") : "—";
      }

      function lookupDictionaryDetail(char) {
        if (!window.cnchar) return { pinyin: "", component: "", radical: "", structure: "", words: [] };

        try {
          const pinyin = cnchar.spell(char, "tone").toLowerCase();
          const radicalInfo = typeof cnchar.radical === "function" ? cnchar.radical(char)[0] : null;
          const radical = radicalInfo && radicalInfo.radical ? radicalInfo.radical : "";
          const words = typeof cnchar.words === "function"
            ? cnchar.words(char).filter((word) => word.length > 1).slice(0, 2)
            : [];

          return {
            pinyin: pinyin === char ? "" : pinyin,
            // 字典的偏旁字段为部首；没有更细粒度拆分时，使用该可靠字段而不猜测组件。
            component: radical,
            radical: radical,
            structure: radicalInfo && radicalInfo.struct ? radicalInfo.struct : "",
            words: words
          };
        } catch (error) {
          console.warn("汉字资料查询失败:", char, error);
          return { pinyin: "", component: "", radical: "", structure: "", words: [] };
        }
      }

      function fitCharacter() {
        if (character.hidden) return;

        const frame = character.parentElement.getBoundingClientRect();
        const char = character.textContent;
        const target = frame.width * 0.82;
        const fontFamily = getComputedStyle(character).fontFamily;
        let low = frame.width * 0.35;
        let high = frame.width * 1.25;

        for (let index = 0; index < 12; index += 1) {
          const mid = (low + high) / 2;
          measuringContext.font = `600 ${mid}px ${fontFamily}`;
          const metrics = measuringContext.measureText(char);
          const measuredWidth =
            Math.abs(metrics.actualBoundingBoxLeft) + Math.abs(metrics.actualBoundingBoxRight);
          const measuredHeight =
            Math.abs(metrics.actualBoundingBoxAscent) + Math.abs(metrics.actualBoundingBoxDescent);

          if (measuredWidth > target || measuredHeight > target) {
            high = mid;
          } else {
            low = mid;
          }
        }

        character.style.fontSize = `${low}px`;
      }

      function requestFit() {
        clearTimeout(fitTimer);
        requestAnimationFrame(fitCharacter);
        fitTimer = setTimeout(fitCharacter, 120);
      }

      function writerSize() {
        return Math.round(character.parentElement.getBoundingClientRect().width);
      }

      let writerFrameSize = 0;

      function stopAnimationLoop() {
        animationLoopToken += 1;
      }

      function waitForNextAnimationStep(token, delay) {
        return new Promise(function(resolve) {
          setTimeout(function() {
            resolve(token === animationLoopToken && writer && !writerTarget.hidden);
          }, delay);
        });
      }

      function playAnimationLoop() {
        if (!writer || writerTarget.hidden) return;

        const token = ++animationLoopToken;
        const run = async function() {
          if (token !== animationLoopToken || !writer || writerTarget.hidden) return;

          await Promise.resolve(writer.showCharacter({ duration: 0 }));
          // 先完整展示字形 10 秒，再开始逐笔动画，便于观察整体结构。
          if (!(await waitForNextAnimationStep(token, 10000))) return;

          await Promise.resolve(writer.hideCharacter({ duration: 250 }));
          if (token !== animationLoopToken || !writer || writerTarget.hidden) return;

          await Promise.resolve(writer.animateCharacter());
          if (!(await waitForNextAnimationStep(token, 700))) return;

          run();
        };

        run();
      }

      function createWriter(char) {
        if (!window.HanziWriter) return false;

        stopAnimationLoop();
        const size = writerSize();
        writerFrameSize = size;
        writerTarget.innerHTML = "";
        character.hidden = true;
        writerTarget.hidden = false;
        writer = HanziWriter.create(writerTarget, char, {
          width: size,
          height: size,
          padding: Math.round(size * 0.09),
          showOutline: true,
          showCharacter: true,
          strokeColor: "#2f343b",
          radicalColor: "#2f343b",
          outlineColor: "rgba(47, 52, 59, 0.18)",
          drawingColor: "#2f343b",
          strokeAnimationSpeed: 1.15,
          delayBetweenStrokes: 260,
          dataCache: {},
          characterDataLoader: function(char, onComplete) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "./hanzi-writer-data/data/" + char + ".json", true);
            xhr.onreadystatechange = function() {
              if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                  onComplete(JSON.parse(xhr.responseText));
                } else {
                  console.warn("字符数据未找到:", char, xhr.status);
                  onComplete(null);
                }
              }
            };
            xhr.onerror = function() {
              console.warn("字符数据加载失败:", char);
              onComplete(null);
            };
            xhr.send();
          }
        });
        playAnimationLoop();
        return true;
      }

      function renderFallbackCharacter(char) {
        stopAnimationLoop();
        writerTarget.hidden = true;
        writerTarget.innerHTML = "";
        character.textContent = char;
        character.hidden = false;
        requestFit();
      }

      function renderStrokeOrder(char) {
        strokeOrder.innerHTML = "";
        strokeSummary.textContent = "正在加载笔顺...";

        loadCharacterData(char)
          .then((data) => {
            strokeSummary.textContent = `笔顺：${data.strokes.length} 笔`;
            data.strokes.forEach((path, index) => {
              const card = document.createElement("div");
              card.className = "stroke-card";

              const num = document.createElement("span");
              num.textContent = String(index + 1);
              card.append(num);

              const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
              svg.setAttribute("viewBox", "0 0 1024 1024");
              svg.setAttribute("aria-label", `第 ${index + 1} 笔`);

              const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
              g.setAttribute("transform", "translate(0, 900) scale(1, -1)");

              data.strokes.slice(0, index).forEach(function(donePath) {
                var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
                p.setAttribute("d", donePath);
                p.setAttribute("fill", "rgba(47, 52, 59, 0.18)");
                g.append(p);
              });

              var currentPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
              currentPath.setAttribute("d", path);
              currentPath.setAttribute("fill", "#2f343b");
              g.append(currentPath);
              svg.append(g);
              card.append(svg);
              strokeOrder.append(card);
            });
          })
          .catch(() => {
            strokeSummary.textContent = "暂时没有找到这个字的笔顺数据。";
          });
      }

      // 从本地加载笔顺数据（与写字渲染器使用相同的数据源）
      function loadCharacterData(char) {
        return new Promise(function(resolve, reject) {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", "./hanzi-writer-data/data/" + char + ".json", true);
          xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
              if (xhr.status === 200) {
                resolve(JSON.parse(xhr.responseText));
              } else {
                reject(new Error("HTTP " + xhr.status));
              }
            }
          };
          xhr.onerror = function() { reject(new Error("Network error")); };
          xhr.send();
        });
      }

      function replayAnimation() {
        playAnimationLoop();
      }

      function showCharacter(char, options) {
        const shouldSyncInput = Boolean(options && options.syncInput);

        if (!char) {
          stopAnimationLoop();
          writerTarget.hidden = true;
          writerTarget.innerHTML = "";
          character.hidden = true;
          empty.hidden = false;
          characterInfo.hidden = true;
          strokeOrder.innerHTML = "";
          strokeSummary.textContent = "笔顺会显示在这里";
          return;
        }

        if (char === currentChar) return;
        currentChar = char;
        empty.hidden = true;
        if (shouldSyncInput) input.value = char;
        if (!createWriter(char)) renderFallbackCharacter(char);
        renderCharacterInfo(char);
        renderStrokeOrder(char);

        recentChars = [char, ...recentChars.filter((item) => item !== char)].slice(0, 12);
        saveRecent();
        renderRecent();
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        showCharacter(hanziAtInputSelection());
      });

      input.addEventListener("input", () => {
        const char = firstHanzi(input.value);
        if (char) showCharacter(char);
      });

      input.addEventListener("click", () => {
        showCharacter(hanziAtInputSelection());
      });

      input.addEventListener("select", () => {
        showCharacter(hanziAtInputSelection());
      });

      input.addEventListener("keyup", () => {
        showCharacter(hanziAtInputSelection());
      });

      window.addEventListener("resize", function() {
        requestFit();
        if (currentChar && !writerTarget.hidden) {
          var s = writerSize();
          if (Math.abs(s - writerFrameSize) > 5) {
            writerFrameSize = s;
            createWriter(currentChar);
          }
        }
      });
      replay.addEventListener("click", replayAnimation);

      renderRecent();
      showCharacter(recentChars[0] || "爱", { syncInput: true });

      // Register Service Worker for offline support
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then((registration) => {
          console.log('Service Worker registered:', registration.scope);
        }).catch((error) => {
          console.warn('Service Worker registration failed:', error);
        });
      }
    </script>
  </body>
</html>
